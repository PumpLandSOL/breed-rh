<!doctype html><html><head><meta charset="utf-8">

</head><body><canvas id="c" width="1280" height="720"></canvas>
<script>
// BREED 10s hype in the Robinhood look: black, Robinhood green, silks cards, desk row, ride-along mirror, CTA.

const clamp = (v, a, b) => Math.max(a, Math.min(b, v)); const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = (k) => 1 - Math.pow(1 - k, 3); const io = (t, a, b, f = .3) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
function txt(s, x, y, size, color, weight = 500, align = 'center', font = 'Space Grotesk', ls = 0) { g.font = `${weight} ${size}px '${font}'`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.letterSpacing = ls + 'px'; g.fillText(s, x, y); g.letterSpacing = '0px'; }
function gradTxt(s, x, y, size, weight = 500, align = 'center') { g.font = `${weight} ${size}px 'Space Grotesk'`; g.textAlign = align; g.textBaseline = 'middle'; const w = g.measureText(s).width; const x0 = align === 'center' ? x - w / 2 : x; const gr = g.createLinearGradient(x0, 0, x0 + w, 0); gr.addColorStop(0, '#00c805'); gr.addColorStop(1, '#9cff7a'); g.fillStyle = gr; g.fillText(s, x, y); }
function bg() { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0e1a10'); gr.addColorStop(.62, '#0b0f0c'); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function card(x, y, w, h, a, fill = '#101610') { g.save(); g.globalAlpha = a; g.shadowColor = 'rgba(0,200,5,.18)'; g.shadowBlur = 30; g.shadowOffsetY = 12; g.fillStyle = fill; g.beginPath(); g.roundRect(x, y, w, h, 18); g.fill(); g.restore(); g.save(); g.globalAlpha = a; g.strokeStyle = 'rgba(0,200,5,.26)'; g.lineWidth = 1; g.beginPath(); g.roundRect(x, y, w, h, 18); g.stroke(); g.restore(); }
function silk(x, y, w, h, kind, emoji, label, a) { g.save(); g.globalAlpha = a; g.beginPath(); g.roundRect(x, y, w, h, 16); g.clip();

window.__seek = function (t) {

  if (t >= 6.3 && t < 8.5) { const a = io(t, 6.3, 8.5); g.globalAlpha = a; txt('Ride along.', W / 2, 170, 68, NAVY); txt("Pick up to 3 horses. Their entries mirror into your desk at half size.", W / 2, 240, 26, SUB, 400, 'center', 'DM Sans'); g.globalAlpha = 1; const k = ease(seg(t, 6.7, 7.6)); card(180, 310, 400, 160, a); card(700, 310, 400, 160, a, '#0f1a12'); g.globalAlpha = a; txt('🏇 BOLT opens', 200, 350, 22, NAVY, 700, 'left'); txt('LONG $HOOD 2x · $2,925', 200, 400, 20, SUB, 400, 'left', 'Space Mono'); txt('🏁 your desk', 720, 350, 22, NAVY, 700, 'left'); txt(k > .5 ? 'LONG $HOOD 2x · $1,462.50 · RIDE' : '…', 720, 400, 20, k > .5 ? '#00c805' : MUT, 700, 'left', 'Space Mono'); g.strokeStyle = '#00c805'; g.lineWidth = 3; g.setLineDash([8, 8]); g.beginPath(); g.moveTo(580, 390); g.lineTo(580 + 120 * k, 390); g.stroke(); g.setLineDash([]); if (k > .95) { g.fillStyle = '#00c805'; g.beginPath(); g.moveTo(700, 390); g.lineTo(686, 382); g.lineTo(686, 398); g.closePath(); g.fill(); } txt('closes when the horse closes · riders counted on every card', W / 2, 560, 13, OR, 700, 'center', 'Space Mono', 2); g.globalAlpha = 1; }
  if (t >= 8.4) { const a = seg(t, 8.4, 8.8); bg(); tape(t, 1 - seg(t, 9.2, 10)); g.globalAlpha = a; g.fillStyle = '#00c805'; const gr = g.createLinearGradient(560, 200, 720, 300); gr.addColorStop(0, '#00c805'); gr.addColorStop(1, '#9cff7a'); g.fillStyle = gr; g.beginPath(); g.roundRect(600, 190, 80, 80, 22); g.fill(); g.font = "700 96px 'Space Grotesk'"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = NAVY; const s1 = 'BR', s2 = 'EED'; const w1 = g.measureText(s1).width, w2 = g.measureText(s2).width; const x0 = W / 2 - (w1 + w2) / 2; g.textAlign = 'left'; g.fillText(s1, x0, 350); gradTxt(s2, x0 + w1, 350, 96, 700, 'left'); txt('breedonrh.xyz', W / 2, 440, 30, NAVY, 700, 'center', 'Space Mono'); txt('FOAL IT · FEED IT · BREED IT · IT TRADES · ON ROBINHOOD CHAIN', W / 2, 495, 12, OR, 700, 'center', 'Space Mono', 3); g.globalAlpha = 1; }
  return true;
};

</script></body></html>
